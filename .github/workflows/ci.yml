name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for plugin changes without version bump
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # Check if any plugin/ files changed (excluding plugin.json itself)
          PLUGIN_CHANGES=$(git diff --name-only "$BASE" "$HEAD" -- 'plugin/' | grep -v 'plugin/.claude-plugin/plugin.json' || true)

          if [[ -z "$PLUGIN_CHANGES" ]]; then
            echo "No plugin changes detected — skipping version check."
            exit 0
          fi

          echo "Plugin files changed:"
          echo "$PLUGIN_CHANGES"
          echo ""

          # Check if version was bumped in either file
          MARKETPLACE_DIFF=$(git diff "$BASE" "$HEAD" -- '.claude-plugin/marketplace.json' || true)
          PLUGIN_JSON_DIFF=$(git diff "$BASE" "$HEAD" -- 'plugin/.claude-plugin/plugin.json' || true)

          if echo "$MARKETPLACE_DIFF" | grep -q '"version"' && echo "$PLUGIN_JSON_DIFF" | grep -q '"version"'; then
            echo "Version bump detected — check passed."
            exit 0
          fi

          echo "::error::Plugin files changed without a version bump. Run: scripts/bump-plugin-version.sh patch (or minor/major)"
          exit 1

  plugin-token-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Enforce plugin token budget
        run: bash scripts/measure-plugin-tokens.sh --ci

  plugin-bundle-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Keyless by construction: build-plugin-bundle.mjs swaps the generated
      # PostHog key module for the empty-string placeholder, so this rebuild
      # reproduces the committed bundle byte-for-byte. Do NOT pass the
      # POSTHOG_API_KEY secret here — a keyed rebuild would always diff.
      - name: Rebuild plugin bundle (keyless)
        run: npm run build:plugin

      - name: Verify committed bundle is fresh
        run: |
          if [[ -n "$(git status --porcelain -- plugin/server/)" ]]; then
            echo "::error::plugin/server/ is stale — run 'npm run build:plugin' and commit the result."
            git status --porcelain -- plugin/server/
            git diff --stat -- plugin/server/
            exit 1
          fi
          echo "Committed plugin bundle is up to date."

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22, 24]
      fail-fast: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
